name: publish-pdf
on:
  push:
    branches: [main]
    paths:
      - paper/main.tex
      - Makefile
      - .github/workflows/build-pdf.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: sudo apt-get update -qq && sudo apt-get install -y -qq latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Generate PDF and manifest
        run: |
          make pdf
          make clean
          make checksums
      - name: Commit generated PDF and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.pdf SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh preprint PDF and SHA-256 manifest [skip ci]"
            git push
          fi
